services:

  backend:
    build: ./backend

    container_name: ticket-system-backend

    ports:
      - "3000:3000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    environment:
      NODE_ENV: development
      JWT_SECRET: dev_secret
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ticket_system

    depends_on:
      - postgres

    command: npm start

  frontend:
    build: ./frontend

    container_name: ticket-system-frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      VITE_API_URL: http://localhost:3000

    depends_on:
      - backend

    command: npm run dev -- --host

  postgres:
    image: postgres:17

    container_name: ticket-system-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticket_system

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
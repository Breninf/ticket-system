name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    # banco PostgreSQL temporário dentro do próprio servidor do GitHub
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ticket_admin
          POSTGRES_PASSWORD: senha_secreta_ci
          POSTGRES_DB: ticket_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd backend
          npm install

      # Cria as variáveis de ambiente necessárias para o Prisma e o JWT rodarem na nuvem
      - name: Setup Environment Variables
        run: |
          cd backend
          echo "DATABASE_URL=postgresql://ticket_admin:senha_secreta_ci@localhost:5432/ticket_system_test?schema=public" > .env
          echo "JWT_SECRET=chave_secreta_dos_testes_de_ci_123" >> .env
          echo "PORT=3000" >> .env

      # Prepara as tabelas e o Prisma Client antes de chamar o Jest
      - name: Run Prisma Migrations
        run: |
          cd backend
          npx prisma generate
          npx prisma migrate deploy

      - name: Run tests
        run: |
          cd backend
          npm test

  build:
    runs-on: ubuntu-latest
    needs: test   

    # Este bloco só roda quando houver push definitivo na branch main
    if: github.ref == 'refs/heads/main'  

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t node-api ./backend

apiVersion: v1
kind: ConfigMap
metadata:
  name: syslog-ng-config
data:
  syslog-ng.conf: |
    @version: 4.2
    options { time-reap(30); mark-freq(10); keep-hostname(yes); };
    source s_network { tcp(ip(0.0.0.0) port(514)); };
    destination d_file { file("/var/log/ticket-system/app-logs.txt"); };
    log { source(s_network); destination(d_file); };
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: syslog-ng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: syslog-ng
  template:
    metadata:
      labels:
        app: syslog-ng
    spec:
      containers:
        - name: syslog-ng
          image: balabit/syslog-ng:latest
          ports:
            - containerPort: 514
          volumeMounts:
            - name: config-volume
              mountPath: /etc/syslog-ng
            - name: logs-volume
              mountPath: /var/log/ticket-system
      volumes:
        - name: config-volume
          configMap:
            name: syslog-ng-config
        - name: logs-volume
          hostPath:
            path: /data/ticket-system-logs
---
apiVersion: v1
kind: Service
metadata:
  name: syslog-service
spec:
  selector:
    app: syslog-ng
  ports:
    - protocol: TCP
      port: 514
      targetPort: 514
